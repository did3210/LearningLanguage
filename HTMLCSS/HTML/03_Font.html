<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Hellow</h1>
  <h2>Hellow</h2>
  <h3>Hellow</h3>
  <h4>Hellow</h4>
  <h5>Hellow</h5>
  <h6>Hellow</h6>

  <hr> <!--가로 줄 긋기 태그-->

  <p>
    안녕하세요. p 태그로서 문단을 나누는데 사용이 됩니다. 알았으면 꺼지세요.
  </p>
  저는 <br><!--줄 바꿈 태그-->누구일까요?
  <b><br>저는 볼드체에요.</b>
  <strong><br>저는 강조체예요.</strong>
  <em><br>전 이탈리아에서 왔어요.</em>
  <i><br>저도 이탈리아에서 왔어요.</i>

  <!--
  b,i 태그는 단순히 텍스트 변환에만 영향을 끼침
  strong,em 태그는 텍스트 강조 + 스크린리더 기능에서 특성에 맞는 억양까지 음으로 발생시킴
  -->
</body>

</html>
