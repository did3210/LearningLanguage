<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 12px;
        }

        .col1 {
            width: 80px;
            height: 80px;
        }

        .col2 {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>Table 기본</h1>
    <table>
        <caption>
            프로필 테이블
        </caption>
        <tr>
            <th>이름</th>
            <th>취미</th>
            <th>특기</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>도술</td>
            <td>축지법</td>
        </tr>
        <tr>
            <td>짐</td>
            <td>헬스</td>
            <td>코딩</td>
        </tr>
    </table>
    <hr>

    <table>
        <caption>학급 점수</caption>
        <colgroup> <!--열 제어-->
            <col class="col1" />
            <col class="col2" />
            <col />
            <col />
            <col />
            <col />
        </colgroup>
        <thead> <!--테이블 제목-->
            <tr>
                <th>반</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>코딩</th>
            </tr>
        </thead>
        <tbody><!--테이블 내용-->
            <tr>
                <td rowspan="4">1반</td> <!--rowspan:행 병합-->
                <td>짐코딩</td>
                <td>90</td>
                <td>100</td>
                <td>70</td>
                <td>80</td>
            </tr>
            <tr>
                <td>홍길도</td>
                <td>89</td>
                <td>92</td>
                <td>75</td>
                <td>60</td>
            </tr>
            <tr>
                <td>김영길</td>
                <td>80</td>
                <td>92</td>
                <td>45</td>
                <td>20</td>
            </tr>
        </tbody>
        <tfoot> <!--테이블 결과값-->
            <tr>
                <td colspan="2">평균</td> <!--colspan:열 병합-->
                <td>80</td>
                <td>92</td>
                <td>45</td>
                <td>20</td>
            </tr>
        </tfoot>

    </table>
</body>

</html>
