<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>
<body>
    <h1>Table 기본</h1>
    <table>
        <caption>
            프로필 테이블
        </caption>
        <tr>
            <th>이름</th>
            <th>취미</th>
            <th>특기</th>
        </tr>
        <tr>
            <th>홍길동</th>
            <th>도술</th>
            <th>축지법</th>
        </tr>
        <tr>
            <th>짐</th>
            <th>헬스</th>
            <th>코딩</th>
        </tr>
    </table>
    
</body>
</html>
