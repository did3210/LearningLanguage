    main,
    section,
    article,
    aside,

    header {

    aside {
      float: right;
      width: 25%;
      background-color: #fff9e6;
    }

    main {
      display: block;
      width: 65%;
      float: left;
    }

    footer {
      clear: both;
      background-color: #333;
      color: white;
    }

<body>

      </article>

      <article>

        <p>레이아웃을 잡을 때 Flexbox는 아주 강력한 도구입니다...</p>
      </article>
    </section>
  </main>

  <aside>
    <h4>카테고리</h4>
    <ul>
      <li>Front-end</li>
      <li>Back-end</li>
    </ul>
    <h4>광고</h4>

  <footer>
