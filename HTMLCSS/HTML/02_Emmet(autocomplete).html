<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!--
  자동 완성기능으로 아래는 자식 노드 자동완성을 설명하는 코드이다.
  아래 코드는 div>ul>li> + tab 을 통해서 작성되었다.
  -->

  <div>
    <ul>
      <li></li>
    </ul>
  </div>

  <!--형제노드-->
  <!--아래 코드는 div>ul+al+div> + tab 을 통해서 작성되었다.-->
  <div>
    <ul></ul>
    <al></al>
    <div></div>
  </div>

  <!--반복하기-->
  <!--아래 코드는 div>li*3 + tab 을 통해서 작성되었다.-->
  <div>
    <li></li>
    <li></li>
    <li></li>
  </div>

  <!--아이디를 가진 태그-->
  <!--아래 코드는 span#item + tab 을 통해서 작성되었다.-->
  <span id="item"></span>

  <!--클래스-->
  <!--아래 코드는 span.title + tab 을 통해서 작성되었다.-->
  <span class="title"></span>

  <!--콘텐츠-->
  <!--아래 코드는 span.container{Hellow world!} + tab 을 통해서 작성되었다.-->
  <span class="container">Hellow world!</span>

  <!--자동 넘버링-->
  <!--아래 코드는 p.container{item$} + tab 을 통해서 작성되었다.-->
  <p class="container">item1</p>

  <p class="container">item1</p>
  <p class="container">item2</p>
  <p class="container">item3</p>
  <p class="container">item4</p>
  <p class="container">item5</p>
</body>

</html>
